<!DOCTYPE html>
<html>

<head>
   <title>Netflix Streaming Demo</title>
   <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

   <style>
      * {
         box-sizing: border-box;
      }

      body {
         margin: 0;
         height: 100vh;
         background: #f8f8f8;
         /* Off white background */
         font-family: Arial, Helvetica, sans-serif;
         display: flex;
         justify-content: center;
         align-items: center;
         overflow: hidden;
         color: #333;

      }

      .app {
         width: 90%;
         max-width: 1200px;
         height: 90vh;

         display: flex;
         flex-direction: column;
      }

      h2 {
         margin: 0 0 10px 0;
         flex-shrink: 0;
      }

      .video-card {
         max-width:1200px;
         margin: 20px auto;
         flex: 1;
         background: #ffffff;

         border-radius: 16px;

         box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);

         display: flex;
         justify-content: center;
         align-items: center;
         overflow: hidden;
         padding: 10px;

      }


      video {
         width: 100%;
         height: 100%;
         border-radius: 12px;
         object-fit: cover;

         background: #000;

      }

      h2 {
         margin: 0 0 20px 0;
         text-align: center;
         color: #222;
         font-weight: 600;
         font-size: 1.8rem;
      }
   </style>

</head>

<body>

   <div class="app">
      <h2>🎬 Netflix Streaming Demo</h2>

      <div class="video-card">
         <video id="video" controls preload="metadata" <!-- يحسن تحميل الفيديو -->
            poster="thumbnail.jpg" <!-- صورة تظهر قبل تشغيل الفيديو -->
            width="100%"
            height="auto"
            >
            <source src="video.mp4" type="video/mp4"> 
         </video>
      </div>
   </div>

   <script>
      fetch("/stream")
         .then(res => res.json())
         .then(data => {
            const video = document.getElementById("video");

            if (Hls.isSupported()) {
               const hls = new Hls();
               hls.loadSource(data.url);
               hls.attachMedia(video);
            } else {
               video.src = data.url;
            }
         });
   </script>

</body>

</html>
